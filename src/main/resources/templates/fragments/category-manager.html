<div id="category-manager" class="space-y-8" xmlns:th="http://www.thymeleaf.org">
    <section class="card pad">
        <h3 class="section-title">Add New Category</h3>
        <form class="cat-form" th:action="@{/settings/categories}" method="post"
              hx-post="/settings/categories"
              hx-target="#category-manager"
              hx-swap="outerHTML"
              novalidate>
            <div class="cat-form-name">
                <label for="cat-name" class="field-label">Category Name</label>
                <input type="text" id="cat-name" name="name" required
                       placeholder="e.g. Groceries" class="input">
            </div>
            <div class="cat-form-icon">
                <label class="field-label">Icon</label>
                <div th:replace="~{fragments/emoji-picker}"></div>
            </div>
            <button type="submit" class="btn-primary">Add</button>
            <p class="form-error" th:if="${error != null}" th:text="${error}"></p>
        </form>
    </section>

    <section>
        <h3 class="section-title">Your Categories</h3>
        <div class="category-grid">
            <div class="group category-card" th:each="c : ${categories}"
                 th:attr="data-category-id=${c.id}">
                <div class="category-card-info">
                    <span class="category-icon" th:text="${c.icon}">🍔</span>
                    <span class="category-name" th:text="${c.name}">Food</span>
                </div>
                <th:block th:if="${c.isDefault}">
                    <span class="default-badge">Default</span>
                </th:block>
                <th:block th:unless="${c.isDefault}">
                    <button type="button" class="category-delete" title="Delete Category"
                            th:attr="data-id=${c.id}"
                            th:hx-delete="'/settings/categories/' + ${c.id}"
                            hx-confirm="Are you sure you want to delete this category?"
                            hx-target="#category-manager"
                            hx-swap="outerHTML">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                             stroke-width="1.5" stroke="currentColor" class="icon-sm">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
                        </svg>
                    </button>
                </th:block>
            </div>
        </div>
    </section>
</div>
