<section id="accounts-section" th:fragment="accounts-section" class="section" data-testid="accounts-section">
    <div class="section-header">
        <div>
            <h2 class="section-title">Accounts</h2>
            <div class="net-worth-line">
                <span class="net-worth-label">Net Worth:</span>
                <span class="net-worth-value"
                      th:classappend="${totalBalance != null and totalBalance.signum() < 0} ? 'amount-negative'"
                      th:text="${fmt != null ? fmt.format(totalBalance) : '₹0.00'}">₹0.00</span>
            </div>
        </div>
        <div class="section-actions">
            <button type="button" class="icon-btn" title="Refresh Data" aria-label="Refresh Data"
                    hx-get="/dashboard/sections" hx-target="#dashboard-content" hx-swap="outerHTML">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon-md" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
            </button>
            <button type="button" class="btn-secondary" data-testid="add-account"
                    hx-get="/accounts/form" hx-target="#modal-content" hx-swap="innerHTML"
                    onclick="openFormModal()">+ Add Account</button>
        </div>
    </div>

    <div th:if="${accounts == null or #lists.isEmpty(accounts)}" class="empty-state">
        <p class="text-muted">No accounts yet.</p>
        <button type="button" class="link-btn" hx-get="/dashboard/sections" hx-target="#dashboard-content" hx-swap="outerHTML">Check for seeded data</button>
    </div>

    <div th:unless="${accounts == null or #lists.isEmpty(accounts)}" class="account-groups">
        <div th:each="entry : ${groupedAccounts}" class="account-group">
            <h3 class="group-label">
                <span th:text="${#strings.replace(entry.key.name(), '_', ' ')}">Type</span>
                <span class="group-line"></span>
            </h3>
            <div class="account-grid">
                <div th:each="account : ${entry.value}">
                    <div th:replace="~{fragments/account-card :: card}"></div>
                </div>
            </div>
        </div>
    </div>
</section>
