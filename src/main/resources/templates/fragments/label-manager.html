<div id="label-manager" class="space-y-8" xmlns:th="http://www.thymeleaf.org">
    <section class="card pad">
        <h3 class="section-title">Add New Label</h3>
        <form class="cat-form" th:action="@{/settings/labels}" method="post"
              hx-post="/settings/labels"
              hx-target="#label-manager"
              hx-swap="outerHTML"
              novalidate>
            <div class="cat-form-name">
                <label for="label-name" class="field-label">Label Name</label>
                <input type="text" id="label-name" name="name" required
                       placeholder="e.g. Personal, Work, Tax-Deductible" class="input">
            </div>
            <button type="submit" class="btn-primary">Add</button>
            <p class="form-error" th:if="${error != null}" th:text="${error}"></p>
        </form>
    </section>

    <section>
        <h3 class="section-title">Your Labels</h3>
        <div class="label-chips">
            <div class="label-chip" th:each="l : ${labels}" th:attr="data-label-id=${l.id}">
                <span class="label-chip-name" th:text="${l.name}">NEEDS</span>
                <th:block th:if="${l.isDefault}">
                    <span class="default-badge">Default</span>
                </th:block>
                <th:block th:unless="${l.isDefault}">
                    <button type="button" class="label-chip-delete" title="Delete Label"
                            th:hx-delete="'/settings/labels/' + ${l.id}"
                            hx-confirm="Are you sure you want to delete this label?"
                            hx-target="#label-manager"
                            hx-swap="outerHTML"
                            aria-label="Delete label">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                             stroke-width="2" stroke="currentColor" class="icon-xs">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </th:block>
            </div>
        </div>
    </section>
</div>
