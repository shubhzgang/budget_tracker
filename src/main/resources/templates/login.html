<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-theme=${theme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BudgetTracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="auth-corner">
            <span th:replace="~{layout :: theme-toggle}"></span>
        </div>
        <div class="auth-card">
            <h1>Login</h1>

            <div th:if="${error}" class="auth-error" data-testid="login-error" th:text="${error}">Error</div>

            <div th:if="${notice}" class="auth-notice" data-testid="login-notice" th:text="${notice}">Notice</div>

            <form th:action="@{/login}" method="post" class="auth-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email" required data-testid="login-email">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required data-testid="login-password">
                </div>
                <button type="submit" class="btn-primary" data-testid="login-submit">Sign In</button>
            </form>
        </div>
    </div>
    <span th:replace="~{layout :: scripts}"></span>
</body>
</html>
