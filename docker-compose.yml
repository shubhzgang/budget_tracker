services:
  postgres:
    image: postgres:18-alpine
    container_name: budget-tracker-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: budget_tracker
    volumes:
      - pgdata_prod:/var/lib/postgresql
    networks:
      - budget-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d budget_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: .
    container_name: budget-tracker-backend
    ports:
      - "3300:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/budget_tracker
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_FORWARD_HEADERS_STRATEGY: native
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://backend:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budget-tracker-net

  mcp:
    build: ./mcp-server
    container_name: budget-tracker-mcp
    ports:
      - "3002:3002"
    environment:
      BUDGET_TRACKER_URL: http://backend:8080
      MCP_BASE_URL: http://localhost:3002
      MCP_PORT: "3002"
      MCP_HOST: "0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - budget-tracker-net

networks:
  budget-tracker-net:
    driver: bridge

volumes:
  pgdata_prod:
